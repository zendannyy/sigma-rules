title: Hunt - Macos AppleScript - Prompt User for Password (T1056.002)
id: 4c0c37c4-1799-3363-06ee-dcc3c3ba13cc
status: experimental
description: |
  Hunting rule for Atomic Red Team T1056.002 AppleScript password-prompt tests
  (System Preferences / display dialog with hidden answer). Correlate before alerting.
author: zendannyy
date: 2026-06-27
references:
  - https://attack.mitre.org/techniques/T1056/002/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1056
tags:
  - attack.execution
  - attack.t1056.002
  - attack.hunting
logsource:
  product: macos
  category: process_creation
detection:
  selection_binary:
    Image|endswith: '/osascript'
  selection_dialog:
    CommandLine|contains|all:
      - 'display dialog'
      - 'hidden answer'
  selection_lure:
    CommandLine|contains:
      - 'Software Update'
      - 'System Preferences'
      - 'System Settings'
      - 'security update'
      - 'type your password'
  condition: selection_binary and selection_dialog and selection_lure
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized red team or security assessment activity
level: low
