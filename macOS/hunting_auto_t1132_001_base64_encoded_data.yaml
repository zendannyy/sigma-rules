title: Hunt - Macos Base64 Encoded data. (T1132.001)
id: 06fce8b5-1410-d080-447e-3e2b5c217c41
status: experimental
description: |
  Hunting rule loosely based off of Atomic Red Team T1132.001 test "Base64 Encoded data.". Correlate before alerting.
author: zendannyy
date: 2026-06-27
references:
  - https://attack.mitre.org/techniques/T1132/001/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1132
tags:
  - attack.execution
  - attack.t1132.001
  - attack.hunting
logsource:
  product: macos
  category: process_creation
detection:
  selection_binary:
    Image|endswith: '/curl'
  selection_cmd:
    CommandLine|contains|all:
      - 'echo -n'
      - '| base64'
  condition: selection_binary and selection_cmd
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized red team or security assessment activity
  - Tune or disable if overlapping with approved admin tooling
level: low
