title: Hunt - Macos Exfiltrate data HTTPS using curl freebsd,linux or macos (T1048.002)
id: deb9417e-9f67-e9e3-99ae-aba49e383c31
status: experimental
description: |
  Hunting rule loosely based off of Atomic Red Team T1048.002 test "Exfiltrate data HTTPS using curl freebsd,linux or macos". No public in-the-wild intel reference available; correlate before alerting.
author: zendannyy
date: 2026-06-27
references:
  - https://attack.mitre.org/techniques/T1048/002/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1048
tags:
  - attack.execution
  - attack.t1048.002
  - attack.hunting
logsource:
  product: macos
  category: process_creation
detection:
  selection_binary:
    Image|endswith: '/curl'
  selection_cmd:
    CommandLine|contains|all:
      - 'https://file.io/'
      - 'autoDelete=true'
      - 'maxDownloads=1'
  condition: selection_binary and selection_cmd
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized red team or security assessment activity
  - Tune or disable if overlapping with approved admin tooling
level: low
