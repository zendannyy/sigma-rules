title: Hunt - Macos Copy Safari BinaryCookies files using AppleScript (T1539)
id: 445ca44a-0e02-4cd7-68b4-a451d5043f29
status: experimental
description: |
  Hunting rule based off of Atomic Red Team T1539 test "Copy Safari BinaryCookies files using AppleScript". No public in-the-wild intel reference available; correlate before alerting.
author: zendannyy
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1539/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1539
tags:
  - attack.execution
  - attack.t1539
  - attack.hunting
logsource:
  product: macos
  category: process_creation
detection:
  selection_binary:
    Image|endswith: '/osascript'
  selection_cmd:
    CommandLine|contains|all:
      - 'Containers:com.apple.Safari:Data:Library:Cookies:")'
      - 'destinationFolderPath'
      - 'Cookies.binarycookies'
  condition: selection_binary and selection_cmd
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized red team or security assessment activity
  - Tune or disable if overlapping with approved admin tooling
level: low
