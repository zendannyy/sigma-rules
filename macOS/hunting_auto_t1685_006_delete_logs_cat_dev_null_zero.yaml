title: Hunt - Macos Delete log files via cat utility by appending /dev/null or /dev/zero (T1685.006)
id: ebdcbf33-1abf-64a5-2242-7030e7a12f90
status: experimental
description: |
  Hunting rule loosely based off of Atomic Red Team T1685.006 test "Delete log files via cat utility by appending /dev/null or /dev/zero". No public in-the-wild intel reference available; correlate before alerting.
author: zendannyy
date: 2026-07-02
references:
  - https://attack.mitre.org/techniques/T1685/006/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1685
tags:
  - attack.execution
  - attack.t1685.006
  - attack.hunting
logsource:
  product: macos
  category: process_creation
detection:
  selection_binary:
    Image|endswith: '/dd'
  selection_cmd:
    CommandLine|contains|all:
      - 'if=/dev/zero'
      - 'bytes(zeros)'
      - '#truncating'
  condition: selection_binary and selection_cmd
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized red team or security assessment activity
  - Tune or disable if overlapping with approved admin tooling
level: low
