title: Hunt - Macos Delete system log files using OSAScript (T1685.006)
id: 3fdc6e8b-45b1-8ce1-1477-9481f9484cc1
status: experimental
description: |
  Hunting rule for Atomic Red Team T1685.006 test "Delete system log files using OSAScript"
  (do shell script rm of a log path with administrator privileges). Correlate before alerting.
author: zendannyy
date: 2026-07-02
references:
  - https://attack.mitre.org/techniques/T1685/006/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1685
tags:
  - attack.execution
  - attack.t1685.006
  - attack.hunting
logsource:
  product: macos
  category: process_creation
detection:
  selection_binary:
    Image|endswith: '/osascript'
  selection_cmd:
    CommandLine|contains|all:
      - 'do shell script'
      - 'administrator privileges'
    CommandLine|contains:
      - 'unlink '
      - 'shred '
    CommandLine|contains:
      - '/var/log/'
      - '/var/audit/'
      - 'system.log'
  condition: selection_binary and selection_cmd
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized red team or security assessment activity
  - Rare admin AppleScripts that remove log files during troubleshooting
level: low
