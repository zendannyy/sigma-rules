title: Hunt - Macos Delete system log files using Applescript (T1685.006)
id: 478f83b3-bcf0-8531-cdf0-17f576ae684a
status: experimental
description: |
  Hunting rule for Atomic Red Team T1685.006 test "Delete system log files using Applescript"
  (Finder delete of a POSIX log path). Correlate before alerting.
author: zendannyy
date: 2026-07-02
references:
  - https://attack.mitre.org/techniques/T1685/006/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1685
tags:
  - attack.execution
  - attack.t1685.006
  - attack.hunting
logsource:
  product: macos
  category: process_creation
detection:
  selection_binary:
    Image|endswith: '/osascript'
  selection_cmd:
    CommandLine|contains|all:
      - 'Finder'
      - 'delete'
      - 'POSIX file'
    CommandLine|contains:
      - '/var/log/'
      - '/private/var/log/'
      - '/var/audit/'
      - 'system.log'
  condition: selection_binary and selection_cmd
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized red team or security assessment activity
level: informational
