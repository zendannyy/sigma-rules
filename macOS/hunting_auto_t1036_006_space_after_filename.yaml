title: Hunt - macOS Space-After-Filename Masquerading
id: 6b6182b0-1058-baed-bc24-1a30f29d95d6
status: experimental
description: |
  Hunting rule for trailing-space filename tricks that hide true extensions. Prioritize execution from user download directories.
  One singal in a correlation rule setupp
author: zendannyy
date: 2026-07-22
references:
  - https://attack.mitre.org/techniques/T1036/006/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1036
  - https://objective-see.org/blog/blog_0x16.html
tags:
  - attack.defense_evasion
  - attack.t1036.006
  - attack.hunting
logsource:
  product: macos
  category: process_creation
detection:
  selection_space:
    CommandLine|re: '\.(?:app|exe|sh|command)\s+\b'
  selection_path:
    CommandLine|contains:
      - '/Downloads/'
      - '/tmp/'
  condition: selection_space and selection_path
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Tune or disable if overlapping with approved admin tooling
level: low
